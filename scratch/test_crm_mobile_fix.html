<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Filter Fix Test</title>
  <link rel="stylesheet" href="../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #f1f5f9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  </style>
</head>
<body id="admin-panel-overlay" class="ap-open">
  <div id="ap-crm-tag-body" style="background:#fff; border-radius:12px; overflow:hidden; border:1px solid #e2e8f0;">

    <!-- Segment sub-tabs bar -->
    <div class="ap-crm-sub-tabs-bar ap-crm-segment-sub-bar" style="padding:10px 18px 8px; background:#ff9400 !important; color:#000 !important; font-weight:800; border-bottom:1.5px solid #e08300; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div class="ap-toolbar-tabs" style="background:rgba(0,0,0,0.08); border:1px solid rgba(0,0,0,0.15);">
        <button class="ap-tab-pill ap-user-sub-tab active" style="color:#000; font-weight:700;">All Customers <span class="ap-tab-count" style="background:rgba(0,0,0,0.12); color:#000; font-weight:800;">2</span></button>
        <button class="ap-tab-pill ap-user-sub-tab" style="color:#000; font-weight:700;">★ VIP &amp; High Spend <span class="ap-tab-count" style="background:rgba(0,0,0,0.12); color:#000; font-weight:800;">1</span></button>
        <button class="ap-tab-pill ap-user-sub-tab" style="color:#000; font-weight:700;">Repeat Buyers <span class="ap-tab-count" style="background:rgba(0,0,0,0.12); color:#000; font-weight:800;">1</span></button>
        <button class="ap-tab-pill ap-user-sub-tab" style="color:#000; font-weight:700;">New / Inactive <span class="ap-tab-count" style="background:rgba(0,0,0,0.12); color:#000; font-weight:800;">0</span></button>
      </div>
      <div style="font-size:11.5px; color:#000 !important; font-weight:700;">Customer Segment: <strong style="color:#000 !important; text-transform:uppercase;">all</strong></div>
    </div>

    <!-- Filter Controls -->
    <div style="padding:14px 18px; border-bottom:1px solid #e2e8f0; background:#fff;">
      <div style="display:grid; grid-template-columns: 2.2fr 1.2fr 1.2fr 1.2fr 1.2fr; gap:10px; margin-bottom:10px;">
        <div style="position:relative;">
          <input class="ap-search" id="ap-crm-user-search" placeholder="Search users by name, email, phone, #CUST ID..." style="width:100%; padding-left:34px; padding-right:28px;" />
          <svg viewBox="0 0 24 24" style="position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:#94a3b8; fill:none; stroke-width:2;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </div>
        <select class="ap-select" id="ap-crm-tier-select" style="font-size:12px;">
          <option value="">All Customer Tiers</option>
          <option value="Elite">Gold Elite / VIP</option>
        </select>
        <select class="ap-select" id="ap-crm-metro-select" style="font-size:12px;">
          <option value="">All Locations</option>
          <option value="Delhi">Delhi NCR</option>
        </select>
        <select class="ap-select" id="ap-crm-spend-select" style="font-size:12px;">
          <option value="">All Spend Brackets</option>
          <option value="high">&gt; ₹50,000 GMV</option>
        </select>
        <select class="ap-select" id="ap-crm-status-select" style="font-size:12px;">
          <option value="">All Statuses</option>
          <option value="active">Active Shoppers</option>
        </select>
      </div>

      <!-- Batch Action Strip -->
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; font-size:12px; padding-top:4px;">
        <div id="ap-crm-batch-actions-row" style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
          <span style="color:#64748b;">Selected: <strong style="color:#0f172a;">0 profiles</strong></span>
          <span style="color:#cbd5e1;">|</span>
          <button class="ap-btn ghost" style="padding:3px 8px; font-size:11px;">
            <svg viewBox="0 0 24 24" style="width:12px; height:12px;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            Assign Loyalty Tier
          </button>
          <button class="ap-btn ghost" style="padding:3px 8px; font-size:11px;">
            <svg viewBox="0 0 24 24" style="width:12px; height:12px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            WhatsApp Outreach
          </button>
          <button class="ap-btn ghost" style="padding:3px 8px; font-size:11px;">
            <svg viewBox="0 0 24 24" style="width:12px; height:12px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export Selection
          </button>
        </div>
        <div><button class="ap-btn ghost" style="font-size:11px; color:#2563eb; border:none; background:transparent; cursor:pointer;">Reset User Filters</button></div>
      </div>
    </div>
  </div>
</body>
</html>
