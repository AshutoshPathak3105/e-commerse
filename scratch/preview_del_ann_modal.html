<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Announcement Popup Verification</title>
  <link rel="stylesheet" href="../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; width: 100%; height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; background: #022f43; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  
  <div class="ap-modal-backdrop is-active" style="display:flex; align-items:center; justify-content:center; background:rgba(15,23,42,0.65); position:fixed; inset:0; z-index:100060;">
    <div class="ap-modal-dialog" style="max-width:440px; text-align:center; padding:28px 24px; background:#ffffff; border-radius:16px; box-shadow:0 25px 60px rgba(15,23,42,0.25);">
      <div style="width:52px; height:52px; border-radius:50%; background:#fee2e2; color:#ef4444; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
      </div>
      <h4 style="font-size:18px; font-weight:800; color:#0f172a; margin:0 0 10px;">Delete Announcement?</h4>
      <p style="font-size:13px; color:#64748b; margin:0 0 24px; line-height:1.5;">
        Are you sure you want to permanently remove <strong>"Mega Festive Super Sale: Up to 10% OFF Across All Electronics &amp; Fashion_XYZ"</strong>? It will be removed from the storefront immediately.
      </p>
      <div style="display:flex; justify-content:center; gap:12px;">
        <button type="button" class="ap-btn ghost" id="ap-del-ann-cancel" style="padding:9px 24px; font-size:13px; font-weight:700; background:#ffffff; border:1.5px solid #cbd5e1; color:#0f172a; border-radius:8px; cursor:pointer;">Cancel</button>
        <button type="button" class="ap-btn danger" id="ap-del-ann-confirm" style="padding:9px 24px; font-size:13px; font-weight:800; background:#dc2626; color:#ffffff !important; border:none; border-radius:8px; cursor:pointer;">Delete Announcement</button>
      </div>
    </div>
  </div>

</body>
</html>
