<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homepage 4-Quadrant Category Cards Button Test</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 20px; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .ap-cms-view { max-width: 850px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="admin-panel-overlay" class="ap-open" style="display:block !important; position:relative; inset:auto; background:transparent;">
    <div class="ap-cms-view">
      <div class="ap-table-card" style="border-radius:12px; overflow:hidden;">
        <div class="ap-card-header" style="padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.12); background:#022f43; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="display:flex; align-items:center; gap:10px;">
              <h3 style="margin:0; font-size:15px; font-weight:800; color:#ffffff !important;">Homepage 4-Quadrant Category Cards</h3>
              <span class="ap-badge blue" id="ap-quad-count-badge" style="font-weight:700; background:#0f2744 !important; color:#93c5fd !important; border:1px solid #1e40af !important;">28 Cards</span>
            </div>
            <p style="margin:4px 0 0; font-size:12px; color:#cbd5e1 !important; font-weight:600;">Full control over all 4-item category cards on the customer homepage. Change titles, swap images, edit deal badges, and add/remove cards.</p>
          </div>
          <div class="ap-card-header-actions" style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
            <button type="button" class="ap-btn ghost" id="ap-cms-reset-quad-btn" style="padding:6px 14px; font-size:12px; font-weight:700; background:#ffffff; color:#022f43 !important; border:1px solid #cbd5e1; white-space:nowrap;" title="Restore original factory preset cards">
              ↺ Reset to Defaults
            </button>
            <button type="button" class="ap-btn primary" id="ap-cms-add-quad-btn" style="padding:6px 16px; font-size:12px; font-weight:800; background:#ff9400 !important; color:#000000 !important; border:1.5px solid #e08300 !important; border-radius:8px; cursor:pointer; white-space:nowrap;">
              Add New Homepage Card
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
